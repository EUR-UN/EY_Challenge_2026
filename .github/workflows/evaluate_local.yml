name: Automated Local Evaluation

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r resources/code/general/requirements.txt
        pip install xgboost lightgbm catboost optuna pystac-client odc-stac scikit-learn pandas numpy

    - name: Run Local Evaluation
      run: |
        mkdir -p output
        python src/evaluation/evaluate_local.py > output/new_baseline_scores.txt
        cat output/new_baseline_scores.txt

    - name: Commit and Push results
      if: github.event_name == 'push'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add output/new_baseline_scores.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: updated local evaluation metrics [skip ci]" && git push)
